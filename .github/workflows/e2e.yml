name: E2E (Playwright)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start fixture server
        run: npm run server:up

      - name: Wait for fixture server
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:57893/?fixture=__health > /dev/null && exit 0
            sleep 1
          done
          echo "Fixture server did not become ready in time" >&2
          docker compose -f tests/e2e/docker-compose.yml logs >&2 || true
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          ELMISH_BASE_URL: http://localhost:57893

      - name: Stop fixture server
        if: always()
        run: npm run server:down

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/test-results/
          retention-days: 7
